<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym System</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#1d2735;background:#f4f6f8}header{background:#172333;color:white;padding:24px max(24px,calc((100% - 1120px)/2));font-size:20px;font-weight:750}main{max-width:1120px;margin:auto;padding:44px 24px}h1{font-size:clamp(34px,7vw,52px);margin:0;letter-spacing:-.055em}p{color:#526174}nav,.stats,.toolbar{display:flex;gap:12px;flex-wrap:wrap}.stats{margin:28px 0}.stat{flex:1;min-width:140px;background:white;padding:22px;border:1px solid #dce3ea;border-radius:14px}.stat strong{display:block;font-size:30px;margin-top:8px}.panel{background:white;margin-top:16px;padding:24px;border:1px solid #dce3ea;border-radius:16px}.toolbar{justify-content:space-between;align-items:center}h2{margin:0}button,input,select{font:inherit;border:1px solid #aab8c6;border-radius:8px;padding:9px 12px;background:white;color:inherit}button{cursor:pointer}button[aria-selected=true],.primary{background:#075e54;color:white;border-color:#075e54}button:focus-visible,a:focus-visible{outline:3px solid #089484;outline-offset:2px}.table-wrap{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:500px}td,th{text-align:left;padding:13px 8px;border-bottom:1px solid #e1e7ed}th{font-size:13px;color:#526174}dialog{border:0;border-radius:16px;padding:24px;width:min(420px,90vw)}dialog::backdrop{background:#17233399}label{display:grid;gap:6px;margin:15px 0}footer{margin-top:24px;color:#526174}a{color:#075e54}
</style></head><body><header>Gym System</header><main><h1>Gym dashboard</h1><p>Explore the system with sample records. Changes stay in this browser.</p><div class="stats" id="stats"></div><nav aria-label="Dashboard sections" id="nav"></nav><section class="panel" aria-labelledby="title"><div class="toolbar"><h2 id="title"></h2><div id="controls"></div></div><div id="content"></div></section><footer><a href="https://github.com/7ussaino2005/Gym-System">View original Java project on GitHub</a></footer></main>
<dialog id="editor"><form id="form"><h2 id="formTitle"></h2><label>Name<input name="name" required maxlength="80"></label><label id="typeLabel">Type<select name="type"></select></label><label id="trainerLabel">Personal trainer<select name="trainer"></select></label><div class="toolbar"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save record</button></div></form></dialog>
<script>
const key='gym-system-portfolio-v1';
const samples={Members:[{id:'m1',name:'Sara Ahmed',type:'Student',trainer:'e1'},{id:'m2',name:'Omar Ali',type:'Polytechnic staff',trainer:''},{id:'m3',name:'Mariam Hasan',type:'Student',trainer:'e2'}],Employees:[{id:'e1',name:'Noor Salman',type:'Personal trainer'},{id:'e2',name:'Yusuf Khalid',type:'Personal trainer'},{id:'e3',name:'Dana Isa',type:'Employee'}]};
let data=structuredClone(samples);
try{const saved=localStorage.getItem(key);if(saved)data=JSON.parse(saved)}catch{}
const byId=id=>document.getElementById(id);
const tabs=['Members','Employees','Trainers','Reports'];
const trainers=()=>data.Employees.filter(item=>item.type==='Personal trainer');
const assigned=id=>data.Members.filter(member=>member.trainer===id).length;
let section='Members',editing=null,query='';
function element(tag,value){const node=document.createElement(tag);if(value!==undefined)node.textContent=value;return node}
function button(label,action){const node=element('button',label);node.type='button';node.onclick=action;return node}
function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}render()}
function table(headers,rows){const wrap=element('div');wrap.className='table-wrap';const t=element('table');const head=t.createTHead().insertRow();for(const h of headers)head.append(element('th',h));const body=t.createTBody();for(const row of rows){const tr=body.insertRow();for(const value of row){const cell=tr.insertCell();cell.append(value)}}wrap.append(t);byId('content').replaceChildren(wrap)}
for(const tab of tabs){const control=button(tab,()=>{section=tab;query='';render()});byId('nav').append(control)}
function drawRows(){if(section==='Reports'){table(['Membership type','Members','With a trainer'],['Student','Polytechnic staff','General'].map(type=>{const people=data.Members.filter(item=>item.type===type);return[type,String(people.length),String(people.filter(item=>item.trainer).length)]}));return}
const records=section==='Trainers'?trainers():data[section];const rows=records.filter(item=>[item.name,item.type].some(value=>value.toLowerCase().includes(query.toLowerCase())));if(!rows.length){byId('content').replaceChildren(element('p','No matching records.'));return}
table(['Name','Type',section==='Members'?'Personal trainer':section==='Trainers'?'Assigned members':'Actions',...(section==='Members'?['Actions']:[])],rows.map(item=>{const actions=element('div');actions.append(button('Edit',()=>openEditor(item)),' ',button('Delete',()=>remove(item)));if(section==='Members')return[item.name,item.type,trainers().find(person=>person.id===item.trainer)?.name||'Unassigned',actions];if(section==='Trainers')return[item.name,item.type,String(assigned(item.id))];return[item.name,item.type,actions]}))}
function render(){byId('stats').replaceChildren();for(const [label,count] of [['Members',data.Members.length],['Employees',data.Employees.length],['Personal trainers',trainers().length]]){const stat=element('div',label);stat.className='stat';stat.append(element('strong',count));byId('stats').append(stat)}[...byId('nav').children].forEach((node,i)=>node.setAttribute('aria-selected',String(tabs[i]===section)));byId('title').textContent=section==='Reports'?'Membership report':section;const controls=byId('controls');controls.replaceChildren();if(section!=='Reports'){const search=element('input');search.placeholder='Search records';search.setAttribute('aria-label','Search records');search.value=query;search.oninput=()=>{query=search.value;drawRows()};controls.append(search);if(section!=='Trainers'){const add=button(section==='Members'?'Add member':'Add employee',()=>openEditor());add.className='primary';controls.append(' ',add)}}drawRows()}
const form=byId('form');
function openEditor(item){editing=item?.id||null;const member=section==='Members';byId('formTitle').textContent=(editing?'Edit ':'Add ')+(member?'member':'employee');form.elements.name.value=item?.name||'';form.elements.type.replaceChildren(...(member?['Student','Polytechnic staff','General']:['Employee','Personal trainer']).map(value=>new Option(value,value)));if(item)form.elements.type.value=item.type;byId('trainerLabel').hidden=!member;byId('trainerLabel').style.display=member?'':'none';form.elements.trainer.replaceChildren(new Option('Unassigned',''),...trainers().map(t=>new Option(t.name,t.id)));form.elements.trainer.value=item?.trainer||'';byId('editor').showModal()}
byId('cancel').onclick=()=>byId('editor').close();
form.onsubmit=event=>{event.preventDefault();const name=form.elements.name.value.trim();if(!name)return;const type=form.elements.type.value;if(section==='Employees'&&editing&&type!=='Personal trainer'&&assigned(editing)){alert('Remove this trainer’s member assignments first.');return}const item={id:editing||crypto.randomUUID(),name,type};if(section==='Members')item.trainer=form.elements.trainer.value;data[section]=editing?data[section].map(record=>record.id===editing?item:record):[...data[section],item];byId('editor').close();persist()};
function remove(item){if(section==='Employees'&&assigned(item.id)){alert('Remove this trainer’s member assignments first.');return}if(confirm('Delete '+item.name+' from this demo?')){data[section]=data[section].filter(record=>record.id!==item.id);persist()}}
render();
</script></body></html>
